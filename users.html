{% extends 'base.html' %}{% block content %}<h1>کارنان — Admin</h1><form class="formgrid" method="post"><label>بشپړ نوم<input name="full_name" required></label><label>Username<input name="username" required></label><label>Password<input name="password" required></label><label>صلاحیت<select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label><button>نوی کارن اضافه کول</button></form><div class="tablewrap"><table><tr><th>نوم</th><th>Username</th><th>صلاحیت</th><th>حالت</th><th>عمل</th></tr>{% for u in rows %}<tr><td>{{u.full_name}}</td><td>{{u.username}}</td><td>{{u.role}}</td><td>{{'فعال' if u.active else 'غیرفعال'}}</td><td><form method="post" action="{{url_for('toggle_user',uid=u.id)}}"><button>{{'غیرفعال' if u.active else 'فعال'}}</button></form><form method="post" action="{{url_for('change_password',uid=u.id)}}"><input name="password" placeholder="نوی پټ نوم" required><button>پټ نوم بدلول</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
