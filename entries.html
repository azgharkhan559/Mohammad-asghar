{% extends 'base.html' %}{% block content %}<h1>انټري</h1><form class="formgrid" method="post"><label>نېټه (۱۴۰۵)<input name="date" placeholder="۱۴۰۵/۰۶/۰۵" required></label><label>تفصیل<input name="description" required></label><label>مقدار<input type="number" step="0.01" name="amount" required></label><label>کرنسي<select name="currency"><option>افغاني</option><option>ډالر</option></select></label><label>خانه / حساب<select name="account">{% for a,c in accounts %}<option>{{a}}</option>{% endfor %}</select></label><label>ډول<select name="entry_type"><option value="income">داخل</option><option value="expense">مصرف</option></select></label><label>خانه/پروژه<input name="house"></label><button>ثبت کول</button></form><div class="tablewrap"><table><tr><th>نېټه</th><th>تفصیل</th><th>مقدار</th><th>کرنسي</th><th>حساب</th><th>ډول</th><th>ثبت کوونکی</th></tr>{% for r in rows %}<tr><td>{{r.jalali_date}}</td><td>{{r.description}}</td><td>{{r.amount}}</td><td>{{r.currency}}</td><td>{{r.account}}</td><td>{{'داخل' if r.entry_type=='income' else 'مصرف'}}</td><td>{{r.full_name}}</td></tr>{% endfor %}</table></div>{% endblock %}
