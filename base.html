<!doctype html><html lang="ps" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب سیستم</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body>
{% if session.get('user_id') %}<nav><b>د حساب سیستم</b><span><a href="{{url_for('dashboard')}}">عمومي حساب</a><a href="{{url_for('entries')}}">انټري</a><a href="{{url_for('purchases')}}">خریداري</a><a href="{{url_for('reports')}}">راپور</a>{% if session.get('role')=='admin' %}<a href="{{url_for('users')}}">کارنان</a>{% endif %}<a href="{{url_for('logout')}}">وتل</a></span></nav>{% endif %}<main>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
