{% extends 'base.html' %}{% block content %}<div class="printhead"><h1>د حساب راپور — ۱۴۰۵</h1><p>نېټه: ____________________</p></div><table><tr><th>حساب</th><th>کرنسي</th><th>ټولې داخلې</th><th>ټول مصرف</th><th>پاتې</th></tr>{% for x in data %}<tr><td>{{x.account}}</td><td>{{x.currency}}</td><td>{{'%.2f'|format(x.income)}}</td><td>{{'%.2f'|format(x.expense)}}</td><td>{{'%.2f'|format(x.income-x.expense)}}</td></tr>{% endfor %}</table><button onclick="window.print()">A4 PDF / چاپ</button>{% endblock %}
