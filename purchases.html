{% extends 'base.html' %}{% block content %}<h1>خریداري</h1><form class="formgrid" method="post"><label>نېټه (۱۴۰۵)<input name="date" required></label><label>توکی<input name="item" placeholder="سيمنټ، سیخ ..." required></label><label>مقدار<input type="number" step="0.01" name="quantity"></label><label>واحد<input name="unit" placeholder="بوجۍ، ټنه ..."></label><label>مبلغ<input type="number" step="0.01" name="amount"></label><label>کرنسي<select name="currency"><option>افغاني</option><option>ډالر</option></select></label><label>خانه/پروژه<input name="house"></label><button>ثبت کول</button></form><div class="tablewrap"><table><tr><th>نېټه</th><th>توکی</th><th>مقدار</th><th>واحد</th><th>مبلغ</th><th>کرنسي</th><th>ثبت کوونکی</th></tr>{% for r in rows %}<tr><td>{{r.jalali_date}}</td><td>{{r.item}}</td><td>{{r.quantity}}</td><td>{{r.unit}}</td><td>{{r.amount}}</td><td>{{r.currency}}</td><td>{{r.full_name}}</td></tr>{% endfor %}</table></div>{% endblock %}
